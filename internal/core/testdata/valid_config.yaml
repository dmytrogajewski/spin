# Valid configuration for testing
provider: ollama
model: codellama:13b
provider_config:
  temperature: 0.7
  top_p: 0.9

max_turns: 50
timeout: 5m
work_dir: /tmp/test

sandbox_mode: workspace-only
policy_file: /tmp/policy.star
allowed_commands:
  - git
  - make
  - go

enable_mcp: true
mcp_servers:
  - name: filesystem
    command: mcp-server-filesystem
    args:
      - /workspace
  - name: github
    command: mcp-server-github
    env:
      GITHUB_TOKEN: test-token

enable_git: true
enable_shell: true

max_tokens: 8192
stream_buffer: 100
cache_commands: true

session_dir: /tmp/sessions
history_limit: 1000

