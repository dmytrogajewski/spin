# Example Spin configuration for OpenAI
#
# Save this as ~/.spin/spin.yaml or ~/.config/spin/config.yaml
# Or use with: spin --config-file config-openai.yaml

llm:
  # Provider type
  provider: openai

  # Model name
  model: gpt-4o

  # API endpoint
  base_url: https://api.openai.com/v1

  # Request timeout
  timeout: 60s

  # Authentication (recommended: use keystore)
  # First, store your API key:
  #   spin config set-key my-openai-key sk-...
  # Then reference it:
  key_name: my-openai-key

  # Alternative (deprecated): direct API key
  # api_key: sk-...
  #
  # Or use environment variable:
  #   export OPENAI_API_KEY=sk-...

# Sandbox settings
sandbox:
  mode: workspace-write

# Appearance
appearance:
  theme: auto
  no_color: false
