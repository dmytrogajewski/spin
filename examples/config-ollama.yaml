# Example Spin configuration for local Ollama
#
# Save this as ~/.spin/spin.yaml or ~/.config/spin/config.yaml
# Or use with: spin --config-file config-ollama.yaml

llm:
  # Provider type
  provider: ollama

  # Model name (must be pulled in Ollama first: ollama pull llama3.1)
  model: llama3.1

  # API endpoint (default for local Ollama)
  base_url: http://localhost:11434

  # Request timeout
  timeout: 30s

  # No authentication required for local Ollama
  # key_name: (not needed)
  # api_key: (not needed)

# Sandbox settings
sandbox:
  mode: workspace-write  # allow file modifications in workspace

# Appearance
appearance:
  theme: auto
  no_color: false
