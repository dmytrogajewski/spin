openapi: 3.1.0
info:
  title: Model Context Protocol (MCP) API
  description: |
    The Model Context Protocol (MCP) is a JSON-RPC 2.0 based protocol for communication
    between AI model clients and context servers. It enables tools, resources, and prompts
    to be shared across different AI applications.

    This specification documents the MCP implementation in Spin.

    **Official Specification:** https://modelcontextprotocol.io/specification

    **Transport:** stdio (standard input/output)

    **Protocol:** JSON-RPC 2.0
  version: 2024-11-05
  contact:
    name: Spin Project
    url: https://github.com/dmytrogajewski/spin

servers:
  - url: stdio://
    description: MCP servers communicate via standard input/output

components:
  schemas:
    # Core JSON-RPC 2.0 types
    JSONRPCRequest:
      type: object
      required:
        - jsonrpc
        - method
      properties:
        jsonrpc:
          type: string
          const: "2.0"
          description: JSON-RPC version
        id:
          oneOf:
            - type: string
            - type: number
          description: Request identifier
        method:
          type: string
          description: Method name to invoke
        params:
          type: object
          description: Method parameters
      example:
        jsonrpc: "2.0"
        id: 1
        method: "tools/list"
        params: {}

    JSONRPCResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          description: Successful response result
        error:
          $ref: '#/components/schemas/JSONRPCError'
      example:
        jsonrpc: "2.0"
        id: 1
        result:
          tools: []

    JSONRPCError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Error code
          enum:
            - -32700  # Parse error
            - -32600  # Invalid Request
            - -32601  # Method not found
            - -32602  # Invalid params
            - -32603  # Internal error
            - -32000  # Server error (generic)
        message:
          type: string
          description: Error message
        data:
          description: Additional error information
      example:
        code: -32601
        message: "Method not found"

    # MCP Core Types
    Implementation:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          description: Name of the implementation
          example: "spin"
        version:
          type: string
          description: Version of the implementation
          example: "0.1.0"

    ClientCapabilities:
      type: object
      properties:
        experimental:
          type: object
          additionalProperties: true
        sampling:
          type: object
      description: Client capabilities

    ServerCapabilities:
      type: object
      properties:
        experimental:
          type: object
          additionalProperties: true
        logging:
          type: object
        prompts:
          type: object
          properties:
            listChanged:
              type: boolean
        resources:
          type: object
          properties:
            subscribe:
              type: boolean
            listChanged:
              type: boolean
        tools:
          type: object
          properties:
            listChanged:
              type: boolean
      description: Server capabilities

    # Initialize
    InitializeRequest:
      type: object
      required:
        - protocolVersion
        - capabilities
        - clientInfo
      properties:
        protocolVersion:
          type: string
          description: MCP protocol version
          example: "2024-11-05"
        capabilities:
          $ref: '#/components/schemas/ClientCapabilities'
        clientInfo:
          $ref: '#/components/schemas/Implementation'

    InitializeResponse:
      type: object
      required:
        - protocolVersion
        - capabilities
        - serverInfo
      properties:
        protocolVersion:
          type: string
          description: MCP protocol version the server supports
          example: "2024-11-05"
        capabilities:
          $ref: '#/components/schemas/ServerCapabilities'
        serverInfo:
          $ref: '#/components/schemas/Implementation'

    # Tools
    Tool:
      type: object
      required:
        - name
        - inputSchema
      properties:
        name:
          type: string
          description: Unique identifier for the tool
          example: "read_file"
        description:
          type: string
          description: Human-readable description of the tool's purpose
          example: "Read contents of a file"
        inputSchema:
          type: object
          description: JSON Schema describing the tool's parameters
          example:
            type: object
            properties:
              path:
                type: string
                description: File path to read
            required:
              - path

    ListToolsRequest:
      type: object
      properties:
        cursor:
          type: string
          description: Pagination cursor (optional)

    ListToolsResponse:
      type: object
      required:
        - tools
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        nextCursor:
          type: string
          description: Next pagination cursor

    CallToolRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Tool identifier
          example: "read_file"
        arguments:
          type: object
          description: Tool input parameters
          example:
            path: "/etc/hosts"

    Content:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [text, image, resource]
          description: Content type
        text:
          type: string
          description: Text content (for type="text")
        data:
          type: string
          format: byte
          description: Base64-encoded data (for type="image")
        mimeType:
          type: string
          description: Content MIME type
        uri:
          type: string
          description: Resource URI (for type="resource")

    CallToolResponse:
      type: object
      required:
        - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        isError:
          type: boolean
          description: Indicates if tool execution failed

    # Resources
    Resource:
      type: object
      required:
        - uri
        - name
      properties:
        uri:
          type: string
          description: Unique identifier for the resource
          example: "file:///home/user/project/README.md"
        name:
          type: string
          description: Human-readable name
          example: "README.md"
        description:
          type: string
          description: Additional context about the resource
        mimeType:
          type: string
          description: Resource content type
          example: "text/markdown"

    ListResourcesRequest:
      type: object
      properties:
        cursor:
          type: string
          description: Pagination cursor (optional)

    ListResourcesResponse:
      type: object
      required:
        - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        nextCursor:
          type: string
          description: Next pagination cursor

    ReadResourceRequest:
      type: object
      required:
        - uri
      properties:
        uri:
          type: string
          description: Resource identifier
          example: "file:///home/user/project/README.md"

    ResourceContents:
      type: object
      required:
        - uri
      properties:
        uri:
          type: string
          description: Resource identifier
        mimeType:
          type: string
          description: Content type
        text:
          type: string
          description: Text content (mutually exclusive with blob)
        blob:
          type: string
          format: byte
          description: Base64-encoded binary content

    ReadResourceResponse:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/ResourceContents'

    # Prompts
    PromptArgument:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Parameter name
          example: "filename"
        description:
          type: string
          description: Parameter purpose
          example: "Name of the file to analyze"
        required:
          type: boolean
          description: Whether this parameter must be provided

    Prompt:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Unique identifier for the prompt
          example: "analyze_code"
        description:
          type: string
          description: Context about the prompt's purpose
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/PromptArgument'

    ListPromptsRequest:
      type: object
      properties:
        cursor:
          type: string
          description: Pagination cursor (optional)

    ListPromptsResponse:
      type: object
      required:
        - prompts
      properties:
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/Prompt'
        nextCursor:
          type: string
          description: Next pagination cursor

    GetPromptRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Prompt identifier
          example: "analyze_code"
        arguments:
          type: object
          additionalProperties:
            type: string
          description: Values for prompt parameters
          example:
            filename: "main.go"

    PromptMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: Message role
        content:
          type: array
          items:
            $ref: '#/components/schemas/Content'

    GetPromptResponse:
      type: object
      required:
        - messages
      properties:
        description:
          type: string
          description: Context about the prompt
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PromptMessage'

paths:
  /initialize:
    post:
      summary: Initialize MCP connection
      description: |
        Establishes an MCP connection and negotiates capabilities between client and server.
        This must be the first request sent after connecting.
      operationId: initialize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: initialize
                    params:
                      $ref: '#/components/schemas/InitializeRequest'
            example:
              jsonrpc: "2.0"
              id: 1
              method: "initialize"
              params:
                protocolVersion: "2024-11-05"
                capabilities:
                  experimental: {}
                clientInfo:
                  name: "spin"
                  version: "0.1.0"
      responses:
        '200':
          description: Successful initialization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/InitializeResponse'

  /tools/list:
    post:
      summary: List available tools
      description: Retrieves a list of tools provided by the MCP server
      operationId: listTools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: tools/list
                    params:
                      $ref: '#/components/schemas/ListToolsRequest'
      responses:
        '200':
          description: List of available tools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/ListToolsResponse'

  /tools/call:
    post:
      summary: Call a tool
      description: Invokes a specific tool with provided arguments
      operationId: callTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: tools/call
                    params:
                      $ref: '#/components/schemas/CallToolRequest'
            example:
              jsonrpc: "2.0"
              id: 2
              method: "tools/call"
              params:
                name: "read_file"
                arguments:
                  path: "/etc/hosts"
      responses:
        '200':
          description: Tool execution result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/CallToolResponse'

  /resources/list:
    post:
      summary: List available resources
      description: Retrieves a list of resources provided by the MCP server
      operationId: listResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: resources/list
                    params:
                      $ref: '#/components/schemas/ListResourcesRequest'
      responses:
        '200':
          description: List of available resources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/ListResourcesResponse'

  /resources/read:
    post:
      summary: Read a resource
      description: Retrieves the contents of a specific resource
      operationId: readResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: resources/read
                    params:
                      $ref: '#/components/schemas/ReadResourceRequest'
      responses:
        '200':
          description: Resource contents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/ReadResourceResponse'

  /prompts/list:
    post:
      summary: List available prompts
      description: Retrieves a list of prompts provided by the MCP server
      operationId: listPrompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: prompts/list
                    params:
                      $ref: '#/components/schemas/ListPromptsRequest'
      responses:
        '200':
          description: List of available prompts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/ListPromptsResponse'

  /prompts/get:
    post:
      summary: Get a prompt
      description: Retrieves a specific prompt with provided arguments
      operationId: getPrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/JSONRPCRequest'
                - type: object
                  properties:
                    method:
                      const: prompts/get
                    params:
                      $ref: '#/components/schemas/GetPromptRequest'
      responses:
        '200':
          description: Prompt details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JSONRPCResponse'
                  - type: object
                    properties:
                      result:
                        $ref: '#/components/schemas/GetPromptResponse'

tags:
  - name: Connection
    description: Connection initialization and lifecycle
  - name: Tools
    description: Tool discovery and execution
  - name: Resources
    description: Resource discovery and access
  - name: Prompts
    description: Prompt template management
