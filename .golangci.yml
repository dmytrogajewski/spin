# Generated by promptkit -- do not edit. Regenerate with: promptkit update

# golangci-lint v2 strict configuration
# Generated by promptkit for spin

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  go: "1.26"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  uniq-by-line: false

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - linter
    - file
  show-stats: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dmytrogajewski/spin

linters:
  # Enable ALL linters, only disable what's truly inapplicable.
  default: all
  disable:
    # --- Deprecated ---
    - wsl # Deprecated in v2; replaced by wsl_v5

    # --- Framework/DB-specific: not used in this project ---
    - arangolint # ArangoDB
    - ginkgolinter # Ginkgo testing framework
    - loggercheck # logr/klog/zap structured loggers
    - promlinter # Prometheus metrics naming
    - protogetter # Protobuf getters
    - rowserrcheck # database/sql rows.Err()
    - sqlclosecheck # database/sql Close()
    - zerologlint # zerolog

    # --- Too noisy for most codebases ---
    - exhaustruct # Go idiom is zero-value initialization; this linter fights the language
    - noinlineerr # Inline error returns (return fmt.Errorf(...)) are idiomatic Go; extracting to a variable adds verbosity without benefit
    - gochecknoglobals # Package-level vars for registries, lookup tables, and test fixtures are idiomatic Go
    - gochecknoinits # init() is used for command/test registration; refactoring would add complexity without benefit
    - godox # TODO/BUG comments are legitimate development markers tracked in issue trackers
    - gosmopolitan # Han script characters in test data are intentional for Unicode/i18n testing
    - reassign # Reassigning os.Stdin/os.Stderr in tests is standard practice for capturing output

    # --- Conflicting linters ---
    - whitespace # Conflicts with wsl_v5: multi-func requires blank lines that wsl_v5 forbids
    - nonamedreturns # Conflicts with gocritic(unnamedResult): forbids named returns that gocritic requires for clarity

    # --- Stylistic preference: internal test packages are valid Go ---
    - testpackage # Requiring _test packages for all tests is too invasive; Go stdlib uses internal test packages extensively

  settings:
    cyclop:
      max-complexity: 15
      package-average: 7.0

    depguard:
      rules:
        "deprecated":
          files: ["$all"]
          deny:
            - pkg: github.com/golang/protobuf
              desc: "Use google.golang.org/protobuf instead"
            - pkg: github.com/satori/go.uuid
              desc: "Use github.com/google/uuid instead"
            - pkg: github.com/gofrs/uuid$
              desc: "Use github.com/gofrs/uuid/v5 or later"
        "non-test":
          files: ["!$test"]
          deny:
            - pkg: math/rand$
              desc: "Use math/rand/v2 instead"

    dupl:
      threshold: 100

    embeddedstructfieldcheck:
      forbid-mutex: true

    errcheck:
      check-type-assertions: true
      check-blank: false

    errorlint:
      errorf: true
      asserts: true
      comparison: true
      errorf-multi: true

    exhaustive:
      check: [switch, map]
      default-signifies-exhaustive: true

    exhaustruct:
      exclude:
        # Standard library
        - ^net/http\.(Client|Cookie|Request|Response|Server|Transport)$
        - ^net/url\.URL$
        - ^os/exec\.Cmd$
        - ^reflect\.StructField$
        # Third-party
        - ^github\.com/spf13/cobra\.(Command|CompletionOptions)$
        - ^github\.com/stretchr/testify/mock\.Mock$
        - ^golang\.org/x/tools/go/analysis\.Analyzer$
        - ^gopkg\.in/yaml\.v3\.Node$
      allow-empty-returns: true

    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "Use log/slog for structured output instead of fmt.Print"
          pkg: ^fmt$
      analyze-types: true

    funcorder:
      struct-method: false

    funlen:
      lines: 80
      statements: 40
      ignore-comments: true

    gochecksumtype:
      default-signifies-exhaustive: false

    gocognit:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - ptrToRefParam
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    gocyclo:
      min-complexity: 15

    godoclint:
      enable:
        - no-unused-link
        - require-stdlib-doclink

    godot:
      scope: all
      capital: false

    gomoddirectives:
      replace-local: true

    gosec:
      excludes:
        - G117 # Struct fields named APIKey/ClientSecret are not secrets exposure - they hold config values
        - G204 # Subprocess launched with variable - needed for command execution
      severity: medium
      confidence: medium

    govet:
      enable-all: true
      disable:
        - fieldalignment # conflicts with embeddedstructfieldcheck
      settings:
        shadow:
          strict: true

    iface:
      enable: [identical]

    inamedparam:
      skip-single-param: true

    interfacebloat:
      max: 12

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        # Internal project interfaces returned by factory/builder functions.
        - github.com/dmytrogajewski/spin/internal/ace/adapter.Adapter
        - github.com/dmytrogajewski/spin/internal/ace/curator.Curator
        - github.com/dmytrogajewski/spin/internal/ace/curator.RefinementStrategy
        - github.com/dmytrogajewski/spin/internal/ace/embedding.Embedder
        - github.com/dmytrogajewski/spin/internal/ace/generator.Generator
        - github.com/dmytrogajewski/spin/internal/ace/reflector.Reflector
        - github.com/dmytrogajewski/spin/internal/ace/retrieval.Retriever
        - github.com/dmytrogajewski/spin/internal/agent/executor.CommandExecutor
        - github.com/dmytrogajewski/spin/internal/agent/executor.NotificationSender
        - github.com/dmytrogajewski/spin/internal/agent/executor.Runtime
        - github.com/dmytrogajewski/spin/internal/agent/executor.TerminalClient
        - github.com/dmytrogajewski/spin/internal/auth.Keystore
        - github.com/dmytrogajewski/spin/internal/commands.Command
        - github.com/dmytrogajewski/spin/internal/conversation.EventTransformer
        - github.com/dmytrogajewski/spin/internal/detection.Intervention
        - github.com/dmytrogajewski/spin/internal/history.Storage
        - github.com/dmytrogajewski/spin/internal/llm.Provider
        - github.com/dmytrogajewski/spin/internal/mcp.Client
        - github.com/dmytrogajewski/spin/internal/mcp.Registry
        - github.com/dmytrogajewski/spin/internal/mcp.RegistryManager
        - github.com/dmytrogajewski/spin/internal/patchapply.FileOperation
        - github.com/dmytrogajewski/spin/internal/protocol/acp.notificationSender
        - github.com/dmytrogajewski/spin/internal/security.PolicyStore
        - github.com/dmytrogajewski/spin/internal/session.Storage
        - github.com/dmytrogajewski/spin/internal/task.Task
        - github.com/dmytrogajewski/spin/internal/tools.CommandExecutor
        - github.com/dmytrogajewski/spin/internal/tools.CommandInfo
        - github.com/dmytrogajewski/spin/internal/tools.CommandValidator
        - github.com/dmytrogajewski/spin/internal/tools.ExecutionResult
        - github.com/dmytrogajewski/spin/internal/tools.ShellContext
        - github.com/dmytrogajewski/spin/internal/tools.ShellContextInfo
        - github.com/dmytrogajewski/spin/internal/tools.Tool
        - github.com/dmytrogajewski/spin/internal/tools.ValidationResult
        - github.com/dmytrogajewski/spin/internal/ui/blocks.ToolParamsFormatter
        - github.com/dmytrogajewski/spin/internal/ui/overlay.Command
        - github.com/dmytrogajewski/spin/internal/ui/ports.UI
        # External library interfaces.
        - github.com/openai/openai-go.ChatCompletionMessageParamUnion

    lll:
      line-length: 140
      tab-width: 4

    maintidx:
      under: 20

    misspell:
      locale: US
      ignore-words:
        - cancelled # SDK field name: acp.RequestPermissionOutcome.Cancelled

    mnd:
      ignored-functions:
        - args.Error
        - cobra.ExactArgs
        - cobra.MaximumNArgs
        - cobra.MinimumNArgs
        - cobra.RangeArgs
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - make
        - math.Max
        - math.Min
        - max
        - min
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - strings.SplitN
        - strconv.Format*
        - strconv.Parse*
        - tabwriter.NewWriter

    nakedret:
      max-func-lines: 0

    nestif:
      min-complexity: 4

    nilnil:
      checked-types: [ptr, func, iface, map, chan]

    nolintlint:
      allow-no-explanation: [funlen, gocognit, lll]
      require-explanation: true
      require-specific: true

    nonamedreturns:
      report-error-in-defer: true

    perfsprint:
      strconcat: false

    reassign:
      patterns: [".*"]

    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
        - name: var-naming
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: context-keys-type
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: unexported-return
        - name: blank-imports
        - name: dot-imports
        - name: context-as-argument
        - name: early-return
        - name: unnecessary-stmt
        - name: receiver-naming
        - name: superfluous-else
        - name: confusing-naming
        - name: modifies-value-receiver
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: waitgroup-by-value
        - name: atomic
        - name: empty-block
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: identical-branches
        - name: modifies-parameter
        - name: string-of-int
        - name: defer
          arguments:
            - [
                "call-chain",
                "loop",
                "method-call",
                "recover",
                "immediate-recover",
                "return",
              ]
        - name: range-val-address
        - name: range-val-in-closure
        - name: get-return
        - name: string-format

    sloglint:
      no-global: all
      context: scope

    staticcheck:
      checks: [all]

    tagalign:
      align: true
      sort: true

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          xml: camel

    testifylint:
      enable-all: true

    unconvert:
      fast-math: true
      safe: true

    unparam:
      check-exported: false

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true

    usetesting:
      os-temp-dir: true

    varnamelen:
      max-distance: 6
      min-name-length: 2
      check-receiver: false
      check-return: true
      check-type-param: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - ok
        - err
        - id
        - wg
        - mu
        - db
        - tx
        - fn
        - fs
        - ip
        - tt
        - tc
        - tb
        - sb
        - fd
        - rw
        - kv
        - ch
        - op
        - ln
        - cb
        - ts
        - tp
        - rc
        - dd
        - da
        - si
        - gh
        - nd
        - hp
        - a
        - b
        - c
        - d
        - e
        - f
        - g
        - h
        - k
        - m
        - n
        - p
        - r
        - s
        - t
        - v
        - w
        - x
        - T
      ignore-decls:
        - i int
        - j int
        - k int
        - n int
        - t testing.T
        - b testing.B
        - f testing.F
        - e error
        - w io.Writer
        - r io.Reader
        - s string

    whitespace:
      multi-if: true
      multi-func: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-package-globs:
        - github.com/dmytrogajewski/spin/*

    wsl_v5: {}

  exclusions:
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - linters: [misspell]
        text: "Cancelled"
        path: ".*\\.go"

      # Tests that modify process-global state (os.Stdin, os.Args, os.Setenv) cannot be parallelized.
      - linters: [paralleltest]
        text: "TestReadPatchInput_Stdin"
      - linters: [paralleltest]
        text: "TestConfigEdit"
      - linters: [paralleltest]
        text: "TestGetEditor"

      # Smithery API uses camelCase JSON; these tags match the external API contract.
      - linters: [tagliatelle]
        path: "(cmd/spin/mcp\\.go|internal/mcp/smithery.*\\.go)"

      # SSRF false positives: URLs are validated or come from trusted config.
      - linters: [gosec]
        text: "G704"
      - linters: [gosec]
        text: "G703"

      # Exhaustive switches: many event/key/block type switches intentionally handle only relevant cases.
      - linters: [exhaustive]
        path: "(internal/ui/|internal/tui/|internal/protocol/acp/|cmd/spin/(exec|tui)\\.go)"
      - linters: [exhaustive]
        path: "internal/agent/executor/"
      - linters: [exhaustive]
        path: "_test\\.go"
      - linters: [exhaustive]
        path: "internal/(agent|config|cycle|detection|events|git|memory|patchapply|state)/"

      # funlen: test functions and complex setup functions slightly exceeding limit.
      - linters: [funlen]
        path: "_test\\.go"
      - linters: [funlen]
        text: "createConversationForTUI"

      # gocognit: test helper functions with many assertions are inherently complex.
      - linters: [gocognit]
        path: "_test\\.go"

      # paralleltest: tests with shared state or process-global mutations.
      - linters: [paralleltest]
        text: "TestApplyPatch"
      - linters: [paralleltest]
        text: "TestConfigShow"
      - linters: [paralleltest]
        text: "TestConfigPath"

      # govet shadow: strict shadow detection flags intentional re-declarations in nested scopes.
      - linters: [govet]
        text: "shadow"

      # funcorder: constructor ordering is stylistic; some files have constructors after related methods for readability.
      - linters: [funcorder]
        path: "(internal/apperr/|internal/conversation/|internal/history/)"

      # gocritic: test helper naming suggestions are stylistic.
      - linters: [gocritic]
        path: "_test\\.go"
      - linters: [gocritic]
        text: "unnamedResult"

      # unparam: functions with always-nil error returns maintain interface contracts for future use.
      - linters: [unparam]
        text: "result.*is always nil"
      - linters: [unparam]
        text: "result.*is always"
      - linters: [unparam]
        text: "always receives nil"
      - linters: [unparam]
        text: "is unused"
      - linters: [unparam]
        text: "is never used"

      # musttag: some structs are marshaled with custom logic, not direct json.Marshal.
      - linters: [musttag]
        path: "internal/security/"

      # recvcheck: mixed receiver types are intentional for value/pointer semantics.
      - linters: [recvcheck]
        path: "(internal/state/|internal/tools/parameters\\.go)"

      # errname: some error types don't follow XxxError naming for backward compatibility.
      - linters: [errname]
        path: "internal/config/"

      # sloglint: warn/error context is used where context isn't available.
      - linters: [sloglint]
        text: "WarnContext"

      # wrapcheck: error wrapping is handled at higher levels.
      - linters: [wrapcheck]
        path: "(internal/agent/environment\\.go|internal/ui/output/)"

      # mnd: magic numbers in non-obvious places.
      - linters: [mnd]
        path: "internal/ace/"

      # errchkjson: intentionally ignoring encode errors on best-effort logging.
      - linters: [errchkjson]
        path: "internal/conversation/"

      # forcetypeassert: type assertions are safe in controlled contexts.
      - linters: [forcetypeassert]
        path: "(cmd/spin/exec\\.go|internal/tools/apply_patch\\.go)"

      # fatcontext: nested contexts in test closures are acceptable.
      - linters: [fatcontext]
        path: "_test\\.go"

      # nilerr: intentional nil error return on specific error conditions.
      - linters: [nilerr]
        path: "(internal/agent/ace_service\\.go|internal/protocol/acp/agent\\.go|internal/tools/shell_command\\.go)"

      # nilnil: returning (nil, nil) is intentional for "not found" semantics.
      - linters: [nilnil]
        path: "(cmd/spin/services\\.go|internal/agent/ace_service\\.go|internal/dbg/)"

      # staticcheck: specific false positives.
      - linters: [staticcheck]
        text: "SA4006"
      - linters: [staticcheck]
        text: "ST1003"

      # testifylint: specific assertion style preferences.
      - linters: [testifylint]
        text: "float-compare"

      # thelper: test helpers that don't need t.Helper.
      - linters: [thelper]
        path: "tests/e2e/"

      # mirror: performance-oriented allocation avoidance in non-hot paths.
      - linters: [mirror]
        path: "_test\\.go"

      # wastedassign: some assignments are intentional for readability or future use.
      - linters: [wastedassign]
        path: "(internal/agent/loop\\.go|internal/ui/|cmd/spin/tui\\.go)"
      - linters: [wastedassign]
        path: "_test\\.go"

      # ineffassign: some assignments are for clarity or unused in specific branches.
      - linters: [ineffassign]
        path: "(internal/agent/loop\\.go|internal/ui/)"
      - linters: [ineffassign]
        path: "_test\\.go"

      # errcheck: best-effort operations where errors are intentionally ignored.
      - linters: [errcheck]
        path: "(cmd/spin/exec\\.go|internal/tools/apply_patch\\.go|internal/ui/output/)"

      # prealloc: pre-allocation suggestions in non-hot paths.
      - linters: [prealloc]
        path: "(cmd/spin/|internal/mcp/|internal/protocol/acp/|internal/ui/)"
      - linters: [prealloc]
        path: "_test\\.go"

      # lll: long lines in test data and complex function signatures.
      - linters: [lll]
        path: "_test\\.go"
      - linters: [lll]
        path: "internal/agent/ace_config\\.go"
      - linters: [lll]
        path: "internal/ui/"

      # inamedparam: test interface methods matching stdlib signatures.
      - linters: [inamedparam]
        path: "internal/ui/testkit/"

      # unconvert: some conversions are explicit for clarity or platform safety.
      - linters: [unconvert]
        path: "(internal/ace/generator/|internal/llm/openai/|internal/protocol/acp/terminal_client\\.go)"

      # exhaustive: remaining non-exhaustive switches handle only relevant cases.
      - linters: [exhaustive]
        path: "internal/ace/"
